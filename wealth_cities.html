<html lang="en">
<head>
<meta charset="utf-8">
<!-- Render at device width on phones instead of a zoomed-out desktop page. -->

<style>
  /* ---- Colour tokens ----------------------------------------------------
     All colours live here as custom properties so light and dark mode are
     one swap. --pos / --neg are the bar colours for growth / decline. */
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #6b6964;
    --grid: #e1e0d9;
    --zero: #898781;
    --border: rgba(11, 11, 11, 0.10);
    --btn: #f0efec;
    --hover: rgba(11, 11, 11, 0.04);
    --pos: #2a78d6;
    --neg: #e34948;
  }
  /* Dark mode: follow the OS setting; same tokens, darker values. */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #a3a29b;
      --grid: #2c2c2a;
      --zero: #6b6a66;
      --border: rgba(255, 255, 255, 0.10);
      --btn: #262624;
      --hover: rgba(255, 255, 255, 0.05);
      --pos: #3987e5;
      --neg: #e66767;
    }
  }

  /* iPhone / iPad only: adopt the reader's iOS Dynamic Type size
     (Settings > Display & Brightness > Text Size). Without this, iOS Safari
     ignores that setting and 1rem stays 16px. -webkit-touch-callout is
     supported only on iOS, so desktop Safari (where this font keyword yields
     a small desktop size) is left alone. Because every size below is in rem,
     the whole page, chart included, scales with it. */
  @supports (font: -apple-system-body) and (-webkit-touch-callout: none) {
    html { font: -apple-system-body; }
  }

  /* ---- Page base ------------------------------------------------------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 0.875rem;
    line-height: 1.45;
    /* Turn off the browser's own scroll anchoring. The script keeps the
       tapped control in place itself (see keepInPlace), and two mechanisms
       correcting the same shift would fight. */
    overflow-anchor: none;
  }
  /* Centre column; capped width keeps lines readable on desktop. */
  main { max-width: 65rem; margin: 0 auto; padding: 1.75rem 1rem 3rem; }

  /* ---- Header: title, refresh time, source ----------------------------- */
  header { margin-bottom: 1.125rem; }
  /* Title left, refresh time right; wraps to two lines on narrow screens. */
  .title-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.25rem 1rem; }
  h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  .meta { color: var(--ink-2); font-size: 0.8125rem; }

  /* ---- Card: holds chart, controls, totals, table ---------------------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.125rem 1.25rem 1rem; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  .sub { color: var(--ink-2); font-size: 0.8125rem; margin: 0.125rem 0 0.75rem; }

  /* ---- Buttons (shared) ------------------------------------------------
     Pill-shaped chips. aria-pressed="true" marks the selected chip, so the
     visual state and the screen-reader state come from one attribute. */
  button {
    font: inherit;
    font-size: 0.8125rem;
    color: var(--ink);
    background: var(--btn);
    border: 1px solid var(--border);
    border-radius: 999rem;
    padding: 0.3125rem 0.75rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--zero); }
  button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  /* Visible focus ring for keyboard users only (not on tap or click). */
  button:focus-visible { outline: 0.125rem solid var(--pos); outline-offset: 0.125rem; }
  /* Row count shown inside a region chip, e.g. "Europe 20". */
  .n { opacity: 0.7; margin-left: 0.25rem; font-variant-numeric: tabular-nums; }

  /* Touch screens: make every button at least 2.75rem (44px at default size)
     tall, the minimum tap target Apple recommends. Mouse users keep the
     compact size. */
  @media (pointer: coarse) {
    button { min-height: 2.75rem; padding: 0.5rem 0.875rem; }
  }

  /* ---- Chart ----------------------------------------------------------- */
  /* position: relative so the tooltip can be placed inside the chart box. */
  .chart { position: relative; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: inherit; }
  /* SVG text sizes are in rem too; the script measures the rendered text,
     so bar geometry adapts to whatever size these resolve to. */
  .name { fill: var(--ink); font-size: 0.8125rem; }                         /* city labels */
  .val { fill: var(--ink-2); font-size: 0.75rem; font-variant-numeric: tabular-nums; } /* value at bar end */
  .tick { fill: var(--muted); font-size: 0.6875rem; font-variant-numeric: tabular-nums; } /* axis ticks */
  .empty { fill: var(--ink-2); font-size: 0.875rem; }                       /* "No data" */
  /* Grid and zero lines stay 1px (hairlines); crispEdges stops blurring. */
  .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .zero { stroke: var(--zero); stroke-width: 1; shape-rendering: crispEdges; }
  .bar-pos { fill: var(--pos); }
  .bar-neg { fill: var(--neg); }
  /* .hit is a full-width invisible rect per row so hover works anywhere on
     the row, not only on the (possibly thin) bar. */
  .hit { fill: transparent; }
  .row:hover .hit { fill: var(--hover); }
  .row:hover .bar-pos, .row:hover .bar-neg { opacity: 0.82; }

  /* Tooltip: all measures for one city, current measure in bold.
     pointer-events: none so it never steals the hover from the row under it. */
  .tip {
    position: absolute;
    pointer-events: none;
    min-width: 12rem;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.12);
    padding: 0.5rem 0.625rem;
    font-size: 0.75rem;
  }
  .tip[hidden] { display: none; }
  .tip-head { color: var(--ink-2); margin-bottom: 0.25rem; }
  .tip-head b { color: var(--ink); font-weight: 600; }
  .tip-row { display: flex; justify-content: space-between; gap: 1rem; font-variant-numeric: tabular-nums; }
  .tip-row span:first-child { color: var(--ink-2); }
  .tip-row.on span { color: var(--ink); font-weight: 600; }

  /* Colour key; shown only when the chart has negative bars. */
  .key { display: flex; gap: 1rem; color: var(--ink-2); font-size: 0.75rem; margin-top: 0.5rem; }
  .key[hidden] { display: none; }
  .sw { display: inline-block; width: 0.625rem; height: 0.625rem; border-radius: 0.125rem; margin-right: 0.375rem; vertical-align: -0.0625rem; }

  /* "Show all 50" / "Show top 25", directly under the bars it extends. */
  .more { margin-top: 0.75rem; }
  .more button[hidden] { display: none; }

  /* ---- Controls (beneath the chart) ------------------------------------
     Each group is a label plus a wrapping row of chips. On phones the label
     sits above its chips, so wrapped chips line up at the left edge instead
     of under the label. Wider screens put the label in its own column. */
  .controls {
    display: flex; flex-direction: column; gap: 0.875rem;
    margin-top: 1rem; padding-top: 0.875rem; border-top: 1px solid var(--grid);
  }
  .control { display: grid; grid-template-columns: 1fr; gap: 0.375rem; }
  .control-label { color: var(--ink-2); font-size: 0.8125rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.375rem; }
  @media (min-width: 40rem) {
    .control { grid-template-columns: 4.5rem 1fr; align-items: center; }
  }

  // from 10,000 up).
  function fmtTick(type, v) {
    if (type === 'pct') return (v < 0 ? MINUS : '') + Math.abs(v) + '%';
    return Math.abs(v) >= 10000 ? nfCompact.format(v) : nfInt.format(v);
  }

  // ---- helpers ----------------------------------------------------------
  const svg = document.getElementById('svg');
  const NS = svg.namespaceURI;
  const $ = id => document.getElementById(id);

  // Current root font size in px, i.e. what 1rem resolves to. The SVG is
  // drawn in px, so chart spacing is written in rem and multiplied by this.
  // Read fresh on every draw, so a font-size change takes effect on redraw.
  function remPx() {
    return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  }

  // Create an SVG element with attributes and optional text.
  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }
  // Null handling for sorts. Returns non-zero only when a null is involved;
  // callers fall through to their own comparison when it returns 0.
  function cmp(a, b) {
    // nulls always last, whatever the direction
    if (a === null && b === null) return 0;
    if (a === null) return 1;
    if (b === null) return -1;
    return 0;
  }
  // Rows for the selected region.
  function filtered() {
    return state.region === 'All' ? rows : rows.filter(r => r.REGION === state.region);
  }
  // Pick a round tick step (1, 2, 5 × 10^n) giving about `count` ticks.
  function niceStep(span, count) {
    const raw = span / Math.max(1, count);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    return (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  }
  // SVG path for a horizontal bar from x0 to x1, rounded only at the far
  // end (the end away from the zero line). Handles bars going left too.
  function barPath(x0, x1, y, h, r) {
    const w = Math.abs(x1 - x0);
    r = Math.min(r, w, h / 2);
    if (x1 >= x0) {
      return `M${x0},${y}H${x1 - r}A${r},${r} 0 0 1 ${x1},${y + r}V${y + h - r}` +
             `A${r},${r} 0 0 1 ${x1 - r},${y + h}H${x0}Z`;
    }
    return `M${x0},${y}H${x1 + r}A${r},${r} 0 0 0 ${x1},${y + r}V${y + h - r}` +
           `A${r},${r} 0 0 0 ${x1 + r},${y + h}H${x0}Z`;
  }
  // Widest rendered width of `strings` in CSS class `cls`. Measures real
  // text, so label columns fit the actual font and size in use.
  function textWidth(strings, cls) {
    const t = el('text', { class: cls, x: -9999, y: -9999 });
    svg.appendChild(t);
    let max = 0;
    strings.forEach(s => { t.textContent = s; max = Math.max(max, t.getComputedTextLength()); });
    svg.removeChild(t);
    return max;
  }

  // Run a state change, then scroll so `btn` stays where it was on screen.
  // The controls sit under the chart, so a change that shrinks or grows the
  // chart (e.g. picking a region with 2 cities) would otherwise move the
  // chips out from under the reader's finger.
  function keepInPlace(btn, change) {
    const before = btn.getBoundingClientRect().top;
    change();
    render();
    if (btn.hidden || !btn.isConnected) return;  // nothing to anchor to
    const shift = btn.getBoundingClientRect().top - before;
    if (shift) window.scrollBy(0, shift);
  }

  // ---- buttons ----------------------------------------------------------
  // Build one chip. `count`, if given, shows as a dim number after the label.
  function makeButton(label, count, onClick) {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.appendChild(document.createTextNode(label));
    if (count !== undefined) {
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = count;
      b.appendChild(n);
    }
    b.addEventListener('click', () => onClick(b));
    return b;
  }

  // Region chips: "All" first, then each region with its city count.
  const regionButtons = {};
  [['All', rows.length]].concat(regions.map(g => [g, rows.filter(r => r.REGION === g).length]))
    .forEach(([g, n]) => {
      regionButtons[g] = makeButton(g, n, b => keepInPlace(b, () => { state.region = g; }));
      $('region-buttons').appendChild(regionButtons[g]);
    });

  // Measure chips: pick which column the chart plots.
  const measureButtons = {};
  MEASURES.forEach(m => {
    measureButtons[m.key] = makeButton(m.label, undefined, b => keepInPlace(b, () => { state.measure = m.key; }));
    $('measure-buttons').appendChild(measureButtons[m.key]);
  });

  // Fixed buttons. "Show all" changes chart height the most, so it also
  // keeps itself in place.
  $('toggle-all').addEventListener('click', e =>
    keepInPlace(e.currentTarget, () => { state.showAll = !state.showAll; }));
  $('toggle-table').addEventListener('click', () => { state.tableOpen = !state.tableOpen; render(); });
  $('download').addEventListener('click', downloadCsv);

  // ---- chart ------------------------------------------------------------
  const tip = $('tip');
  const chartBox = $('chart');

  // Fill and place the tooltip for row `r` next to the pointer. Lists every
  // measure, with the one being plotted in bold.
  function showTip(evt, r) {
    const m = state.measure;
    tip.textContent = '';
    const head = document.createElement('div');
    head.className = 'tip-head';
    const b = document.createElement('b');
    b.textContent = r.CITY === null ? DASH : r.CITY;
    head.appendChild(b);
    head.appendChild(document.createTextNode(` · ${r.COUNTRY ?? DASH} · rank ${fmt('int', r.RANK_NO)}`));
    tip.appendChild(head);
    MEASURES.forEach(ms => {
      const row = document.createElement('div');
      row.className = 'tip-row' + (ms.key === m ? ' on' : '');
      const a = document.createElement('span');
      a.textContent = ms.label;
      const v = document.createElement('span');
      v.textContent = fmt(colByKey[ms.key].type, r[ms.key]);
      row.appendChild(a);
      row.appendChild(v);
      tip.appendChild(row);
    });
    tip.hidden = false;
    // Offset from the pointer by 0.875rem; flip to the left side if the tip
    // would run off the right edge of the chart.
    const gap = 0.875 * remPx();
    const box = chartBox.getBoundingClientRect();
    let x = evt.clientX - box.left + gap;
    let y = evt.clientY - box.top + gap;
    if (x + tip.offsetWidth > box.width) x = evt.clientX - box.left - tip.offsetWidth - gap;
    tip.style.left = Math.max(0, x) + 'px';
    tip.style.top = y + 'px';
  }
  function hideTip() { tip.hidden = true; }

  // Draw the bar chart for rows `f`: sort by the selected measure, largest
  // first, then lay out axis, grid, bars, and labels.
  function drawChart(f) {
    const m = MEASURES.find(x => x.key === state.measure);
    const type = colByKey[m.key].type;
    // Largest first; nulls last; ties broken by original rank.
    const sorted = f.slice().sort((a, b) =>
      cmp(a[m.key], b[m.key]) || (b[m.key] - a[m.key]) || (a.RANK_NO - b.RANK_NO));
    const shown = state.showAll ? sorted : sorted.slice(0, TOP_N);

    // Titles describe exactly what is on screen.
    $('chart-title').textContent = `${m.label} by city` + (state.region === 'All' ? '' : ` — ${state.region}`);
    $('chart-sub').textContent = sorted.length === 0 ? '' :
      (shown.length < sorted.length ? `Top ${shown.length} of ${sorted.length} cities` : `${sorted.length} ${sorted.length === 1 ? 'city' : 'cities'}`) +
      ', largest first' + (type === 'pct' ? '. Wealth growth is the percentage change in millionaires.' : '');

    // "Show all / top N" only makes sense when there are more than TOP_N rows.
    const toggle = $('toggle-all');
    toggle.hidden = sorted.length <= TOP_N;
    toggle.textContent = state.showAll ? `Show top ${TOP_N}` : `Show all ${sorted.length}`;
    toggle.setAttribute('aria-pressed', String(state.showAll));

    // Chart spacing, in rem, converted to px for the SVG.
    const rem = remPx();
    const TOP = 1.375 * rem;   // space above the first row for tick labels
    const ROW = 1.75 * rem;    // height of one row
    const BAR = 1.125 * rem;   // bar thickness within a row
    const RADIUS = 0.25 * rem; // corner radius at the bar end
    const TICK_GAP = 5.625 * rem; // aim for one tick per this much width
    const LABEL_PAD = 0.75 * rem; // gap between city label and the plot
    const VALUE_PAD = 0.375 * rem; // gap between bar end and its value

    // Clear and size the SVG. Width = chart box width, so 1 SVG unit = 1 CSS px
    // and the rem-sized CSS text renders at its true size.
    hideTip();
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    // Use the real box width, never a larger minimum: a viewBox wider than
    // the box would shrink all chart text and leave empty bands above and
    // below. The fallback only applies if the box has no width yet.
    const W = chartBox.clientWidth || 17.5 * rem;
    const emptyH = 3.75 * rem;
    svg.setAttribute('viewBox', `0 0 ${W} ${emptyH}`);
    svg.setAttribute('height', emptyH);

    if (shown.length === 0) {
      svg.appendChild(el('text', { class: 'empty', x: W / 2, y: emptyH / 2, dy: '0.35em', 'text-anchor': 'middle' }, 'No data'));
      svg.setAttribute('aria-label', 'No data');
      $('key').hidden = true;
      return;
    }

    // Horizontal layout: [city labels][negative values?][plot area][values].
    // Label column is capped at 42% of the width so long names can't squeeze
    // the bars to nothing on a phone.
    const vals = shown.map(r => r[m.key]).filter(v => v !== null);
    const labels = shown.map(r => fmt(type, r[m.key], m.compact));
    const hasNeg = vals.some(v => v < 0);
    const labelW = Math.min(textWidth(shown.map(r => r.CITY ?? DASH), 'name') + LABEL_PAD + 2, W * 0.42);
    const valueW = textWidth(labels, 'val') + 2 * VALUE_PAD;
    const left = labelW + (hasNeg ? valueW : 0);  // room for values left of negative bars
    const right = W - valueW;                      // room for values right of positive bars

    // Value domain: always includes 0, rounded out to whole tick steps.
    let lo = Math.min(0, ...vals);
    let hi = Math.max(0, ...vals);
    if (hi === lo) hi = lo + 1;
    const step = niceStep(hi - lo, Math.max(2, Math.floor((right - left) / TICK_GAP)));
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    const x = v => left + (v - lo) / (hi - lo) * (right - left);  // value -> px

    // Height grows with the number of rows.
    const H = TOP + shown.length * ROW + 0.25 * rem;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('height', H);

    // Grid lines and tick labels across the top. +0.5 aligns 1px lines to
    // the pixel grid so they stay sharp.
    const gGrid = el('g', {});
    for (let i = Math.round(lo / step); i <= Math.round(hi / step); i++) {
      const t = i * step;
      const xt = Math.round(x(t)) + 0.5;
      if (t !== 0) gGrid.appendChild(el('line', { class: 'grid', x1: xt, x2: xt, y1: TOP - 0.25 * rem, y2: H }));
      gGrid.appendChild(el('text', { class: 'tick', x: xt, y: 0.6875 * rem, 'text-anchor': 'middle' }, fmtTick(type, t)));
    }
    svg.appendChild(gGrid);

    // One <g> per city: hover target, label, bar, value.
    const x0 = x(0);
    shown.forEach((r, i) => {
      const v = r[m.key];
      const y = TOP + i * ROW;
      const g = el('g', { class: 'row' });
      g.appendChild(el('rect', { class: 'hit', x: 0, y: y, width: W, height: ROW, rx: RADIUS }));
      // City name, right-aligned against the plot.
      g.appendChild(el('text', { class: 'name', x: labelW - LABEL_PAD, y: y + ROW / 2, dy: '0.35em', 'text-anchor': 'end' }, r.CITY ?? DASH));
      // Bar, skipped when null or too short to see.
      const by = y + (ROW - BAR) / 2;
      if (v !== null && Math.abs(x(v) - x0) >= 0.5) {
        g.appendChild(el('path', { class: v < 0 ? 'bar-neg' : 'bar-pos', d: barPath(x0, x(v), by, BAR, RADIUS) }));
      }
      // Value label just past the bar end: left of negative bars, right of
      // positive ones, at the zero line when null.
      const vx = v !== null && v < 0 ? x(v) - VALUE_PAD : (v === null ? x0 : x(v)) + VALUE_PAD;
      g.appendChild(el('text', {
        class: 'val', x: vx, y: y + ROW / 2, dy: '0.35em',
        'text-anchor': v !== null && v < 0 ? 'end' : 'start'
      }, labels[i]));
      g.addEventListener('pointermove', e => showTip(e, r));
      g.addEventListener('pointerleave', hideTip);
      svg.appendChild(g);
    });

    // Zero line drawn last so it sits on top of the bars.
    const zx = Math.round(x0) + 0.5;
    svg.appendChild(el('line', { class: 'zero', x1: zx, x2: zx, y1: TOP - 0.25 * rem, y2: H }));

    // Colour key only when red bars are present. Screen readers get a
    // one-sentence summary instead of hundreds of SVG nodes.
    $('key').hidden = !hasNeg;
    const first = shown[0];
    svg.setAttribute('aria-label',
      `${$('chart-title').textContent}. ${shown.length} bars, largest first. ` +
      `Largest: ${first.CITY}, ${fmt(type, first[m.key])}.`);
  }

  // ---- totals -----------------------------------------------------------
  // Sum a column, treating nulls as 0.
  function sum(f, k) { return f.reduce((s, r) => s + (r[k] ?? 0), 0); }

  // Summary line under the controls, plus the "x of y cities" count.
  // Growth is a simple (unweighted) average of the cities' percentages.
  function drawTotals(f) {
    const g = f.map(r => r.WEALTH_GROWTH_PCT).filter(v => v !== null);
    const avg = g.length ? g.reduce((a, b) => a + b, 0) / g.length : null;
    $('totals').textContent =
      `Total for ${state.region === 'All' ? 'all regions' : state.region}: ` +
      `${nfInt.format(f.length)} ${f.length === 1 ? 'city' : 'cities'} · ` +
      `${nfInt.format(sum(f, 'MILLIONAIRES'))} millionaires · ` +
      `${nfInt.format(sum(f, 'CENTI_MILLIONAIRES'))} centi-millionaires · ` +
      `${nfInt.format(sum(f, 'BILLIONAIRES'))} billionaires · ` +
      `average growth ${avg === null ? DASH : fmtPct(avg, 1)}`;
    $('count').textContent = `${f.length} of ${rows.length} cities`;
  }

  // ---- table ------------------------------------------------------------
  // Build the header once. Each header is a button: first click sorts by
  // that column (text and rank ascending, numbers descending); clicking again
  // reverses the direction.
  const theadRow = $('thead-row');
  const thByKey = {};
  COLS.forEach(c => {
    const th = document.createElement('th');
    th.scope = 'col';
    if (c.type !== 'text') th.className = 'num';
    const b = document.createElement('button');
    b.type = 'button';
    b.appendChild(document.createTextNode(c.label));
    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    b.appendChild(arrow);
    b.addEventListener('click', () => {
      if (state.sortKey === c.key) state.sortDir = -state.sortDir;
      else { state.sortKey = c.key; state.sortDir = c.type === 'text' || c.key === 'RANK_NO' ? 1 : -1; }
      render();
    });
    th.appendChild(b);
    theadRow.appendChild(th);
    thByKey[c.key] = { th: th, arrow: arrow };
  });

  // Show or hide the table and refill its body for rows `f`.
  function drawTable(f) {
    const wrap = $('table-wrap');
    wrap.hidden = !state.tableOpen;
    $('toggle-table').textContent = state.tableOpen ? 'Hide data ▴' : 'Show data ▾';
    $('toggle-table').setAttribute('aria-expanded', String(state.tableOpen));

    // Sort marker and aria-sort on the active column only.
    COLS.forEach(c => {
      const on = c.key === state.sortKey;
      thByKey[c.key].th.setAttribute('aria-sort', on ? (state.sortDir > 0 ? 'ascending' : 'descending') : 'none');
      thByKey[c.key].arrow.textContent = on ? (state.sortDir > 0 ? '▲' : '▼') : '';
    });

    // Sort: nulls last in both directions; ties broken by rank.
    const k = state.sortKey;
    const isText = colByKey[k].type === 'text';
    const sorted = f.slice().sort((a, b) => {
      const n = cmp(a[k], b[k]);
      if (n || a[k] === null) return n || (a.RANK_NO - b.RANK_NO);
      const d = isText ? a[k].localeCompare(b[k]) : a[k] - b[k];
      return d * state.sortDir || (a.RANK_NO - b.RANK_NO);
    });

    const tbody = $('tbody');
    tbody.textContent = '';
    if (sorted.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = COLS.length;
      td.textContent = 'No data';
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }
    // Build rows in a fragment, then insert once (one reflow, not one per row).
    const frag = document.createDocumentFragment();
    sorted.forEach(r => {
      const tr = document.createElement('tr');
      COLS.forEach(c => {
        const td = document.createElement('td');
        if (c.type !== 'text') td.className = 'num';
        td.textContent = fmt(c.type, r[c.key]);
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
  }

  // ---- CSV download -----------------------------------------------------
  // Quote one CSV cell. Raw values, not display strings, so Excel gets numbers.
  function csvCell(v) {
    if (v === null || v === undefined) return '';
    let s = String(v);
    if (typeof v === 'string' && /^[=+\-@]/.test(s)) s = "'" + s; // stop Excel reading text as a formula
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  // Download the rows for the current region (all columns, rank order).
  function downloadCsv() {
    const f = filtered();
    const lines = [COLS.map(c => c.key).join(',')]
      .concat(f.map(r => COLS.map(c => csvCell(r[c.key])).join(',')));
    // BOM so Excel reads UTF-8 (e.g. "Èze") correctly
    const blob = new Blob(['\uFEFF' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    // File name includes the region, e.g. wealth_cities_north_america.csv
    a.download = 'wealth_cities' + (state.region === 'All' ? '' : '_' + state.region.toLowerCase().replace(/[^a-z0-9]+/g, '_')) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ---- render -----------------------------------------------------------
  // Redraw everything from `state`. Cheap enough (≤ a few hundred rows) to
  // run on every click.
  function render() {
    Object.keys(regionButtons).forEach(g => regionButtons[g].setAttribute('aria-pressed', String(g === state.region)));
    Object.keys(measureButtons).forEach(k => measureButtons[k].setAttribute('aria-pressed', String(k === state.measure)));
    const f = filtered();
    drawChart(f);
    drawTotals(f);
    drawTable(f);
  }

  // Header text from the payload.
  const title = payload.title || 'Report';
  document.title = title;
  $('title').textContent = title;
  $('refreshed').textContent = payload.refreshed_utc || DASH;
  $('source').textContent = payload.source || '';

  render();

  // Redraw the chart when its box changes width (rotation, window resize).
  // Throttled to one redraw per animation frame.
  let lastW = chartBox.clientWidth;
  let raf = 0;
  function onResize() {
    if (chartBox.clientWidth === lastW) return;
    lastW = chartBox.clientWidth;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => drawChart(filtered()));
  }
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(chartBox);
  else window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
